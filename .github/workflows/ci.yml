name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.3, MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: onushondhan_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, curl, zip, gd, intl, pdo_mysql, sodium, exif, fileinfo, bcmath
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Migrations from a clean database + seed
        run: DB_DATABASE=onushondhan_test php artisan migrate:fresh --seed --force
      - name: Tests (Pest)
        run: php artisan test
      - name: Dependency audit
        run: composer audit

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          API_INTERNAL_URL: http://127.0.0.1:8001
          NEXT_PUBLIC_SITE_URL: https://example.com
      - run: npm audit --omit=dev

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: onushondhan_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, curl, zip, gd, intl, pdo_mysql, sodium, exif, fileinfo, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          nohup ../scripts/e2e-backend.sh > /tmp/e2e-backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8001/api/v1/health && break; sleep 2; done
      - name: Frontend deps + browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            /tmp/e2e-backend.log
          retention-days: 7
