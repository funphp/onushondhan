# Onushondhan — Nginx site (single host). Replace example.com with the real domain.
# Next.js (SSR) serves the site; Laravel (PHP-FPM) serves /api, /sanctum, /admin
# (Filament) and its assets. TLS certificates are provisioned separately (e.g. certbot).

upstream onushondhan_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Coarse abuse protection; the application enforces finer per-route limits.
limit_req_zone $binary_remote_addr zone=onushondhan_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=onushondhan_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Enable HSTS only once HTTPS is permanent for the domain (see docs/DEPLOYMENT.md).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # Evidence uploads (EVIDENCE_MAX_UPLOAD_MB=100 + multipart overhead).
    client_max_body_size 110m;
    client_body_timeout 120s;

    access_log /var/log/nginx/onushondhan.access.log;
    error_log  /var/log/nginx/onushondhan.error.log warn;

    set $laravel_root /var/www/onushondhan/current/backend/public;

    # Never serve dotfiles or VCS metadata.
    location ~ /\.(?!well-known) { deny all; }

    # ---- Laravel -----------------------------------------------------------
    location ^~ /api/v1/auth/ {
        limit_req zone=onushondhan_auth burst=20 nodelay;
        root $laravel_root;
        try_files $uri /index.php?$query_string;
    }
    location ^~ /api/ {
        limit_req zone=onushondhan_api burst=60 nodelay;
        root $laravel_root;
        try_files $uri /index.php?$query_string;
    }
    location ~ ^/(sanctum|admin|livewire|filament)(/|$) {
        root $laravel_root;
        try_files $uri /index.php?$query_string;
    }
    location ~ ^/(css|js|fonts)/filament/ {
        root $laravel_root;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /index.php {
        root $laravel_root;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/onushondhan.sock;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }
    # No other PHP file is ever executable.
    location ~ \.php$ { return 404; }

    # ---- Next.js -----------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://onushondhan_next;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass http://onushondhan_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Internal-only listener (loopback) for the Next.js server's server-side API calls
# (API_INTERNAL_URL=http://127.0.0.1:8080) and the deploy/monitoring health check.
# Without it, http://127.0.0.1 hits the port-80 server above and is redirected to HTTPS.
server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log off;

    set $laravel_root /var/www/onushondhan/current/backend/public;

    location ^~ /api/ {
        root $laravel_root;
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        root $laravel_root;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/onushondhan.sock;
        fastcgi_read_timeout 60s;
        internal;
    }
    location / { return 404; }
}
