; /etc/php/8.3/fpm/pool.d/onushondhan.conf
[onushondhan]
user = onushondhan
group = onushondhan
listen = /run/php/onushondhan.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 130s

; Health/status endpoints for monitoring (restrict to localhost in Nginx if exposed).
pm.status_path = /fpm-status
ping.path = /fpm-ping

php_admin_value[upload_max_filesize] = 105M
php_admin_value[post_max_size] = 110M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[expose_php] = Off
php_admin_value[session.cookie_httponly] = 1
php_admin_value[disable_functions] = passthru,shell_exec,system,pcntl_exec
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/onushondhan/php-fpm.error.log
